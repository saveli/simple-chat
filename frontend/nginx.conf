server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Docker's embedded DNS. Upstreams are resolved per request (via the variables
    # below) rather than at startup, so this container still comes up when the
    # wrapper or the chat backend is not ready yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Everything the aLLMa wrapper owns:
    #   /v1     - the /v1/session/{info,init,opening,end} lifecycle calls, which
    #             ChatPage.tsx issues against window.location.origin, plus
    #             /v1/chat/completions and /v1/models
    #   /debug  - debug UI and the persisted-session viewer
    #   /api    - /api/chat, the debug UI's chat endpoint
    #   /health - for external uptime monitoring through the reverse proxy
    # The chat backend owns /ws (below) and /dashboard, /download, /llm, /project,
    # so there is no prefix collision between the two upstreams.
    location ~ ^/(v1|debug|api|health) {
        set $allma_wrapper allma-wrapper;
        proxy_pass http://$allma_wrapper:11435$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An LLM turn is slow: response-time padding targets ~7.5 s, and a stalled
        # OpenAI request plus its retry has been measured at ~70 s.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # simple-chat backend Socket.IO, mounted at /ws in backend/src/main.py.
    # The client uses transports: ["websocket"], so the upgrade must pass through.
    location /ws {
        set $chat_backend simple-chat-backend;
        proxy_pass http://$chat_backend:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Static documents (data protection sheet). No SPA fallback here: a missing
    # file must 404, not answer 200 with the chat app.
    location /docs/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
